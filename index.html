    <script>
      (function() {
        try {
          var manual = localStorage.getItem('theme_mode_manual');
          if (manual === 'dark' || manual === 'red') {
            document.documentElement.classList.add('dark');
            if (manual === 'red') document.documentElement.classList.add('red-gate-active');
          } else if (manual === 'light') {
            document.documentElement.classList.remove('dark', 'red-gate-active');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark', 'red-gate-active');
          }
        } catch(e) {}
      })();
    </script>
